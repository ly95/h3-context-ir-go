name: Go

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOWORK: 'off'

jobs:
  test:
    name: Go
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Install media integration prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Check formatting
        run: make check-format
      - name: Vet every package
        run: make vet
      - name: Run all native tests and media integrations
        run: make test
      - name: Run all native tests with the race detector
        run: make test-race
      - name: Fuzz document and evidence decoding
        run: make fuzz
